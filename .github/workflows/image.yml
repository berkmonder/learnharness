# berkmonder's fork: every push to main builds the server image, starts it and checks it answers, then
# publishes it to GitHub's registry (ghcr.io/berkmonder/learnharness). The PC runs it and picks up each new
# version by itself (nix-dotfiles: hosts/desktop/learnharness.nix).
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write # publish the image (with this run's own token; nothing stored)
concurrency:
  group: image
env:
  IMAGE: ghcr.io/berkmonder/learnharness
jobs:
  image:
    if: github.repository == 'berkmonder/learnharness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          podman build -f Containerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
      - name: Start it and check it answers
        run: |
          podman run -d --name smoke "$IMAGE:latest"
          for _ in $(seq 30); do
            podman exec smoke node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 2
          done
          podman logs smoke
          exit 1
      - name: Publish
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
